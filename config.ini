# canon-scan-to-pc settings
# Installed copy: ~/.config/canon-scan-to-pc/config.ini
# After editing:  systemctl --user restart canon-scan-to-pc

[printer]
# The printer's IP address or host name. Leave empty to find it on the network
# automatically (needs avahi-browse). Set it if you have more than one Canon scanner.
host =
# The name shown in the printer's Scan > Computer list (ASCII, at most 15 characters).
# Empty = this computer's host name.
name =

[scan]
# Where scans are saved
output_dir = ~/Scans
# pdf (all pages in one file), png or jpeg (one file per page)
format = pdf
# Used when the printer sends a colour choice that isn't listed in [codes] below:
# Color, Gray or Lineart
mode = Color
# 75, 150, 300 or 600
resolution = 300
# auto = document feeder if pages are loaded, otherwise the glass;
# or flatbed, adf, adf-duplex
source = auto
# letter, legal, a4, or full (the whole glass / 14-inch feeder length)
paper = letter
# Desktop notification when a scan is saved or fails
notify = yes

# The colour choice made on the printer's panel arrives as a code byte.
# Codes that aren't listed use [scan] mode; the log shows them so they can be added here.
[codes]
# "Color"
01 = Color
# "Black & White". Gray keeps signatures and photos readable;
# Lineart (pure black and white) makes much smaller files.
02 = Gray
